[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# On-site shop. /shop/<slug> is rendered by shop-page.js from the Stripe catalog (404 if unknown).
# The old shop.html (an Etsy API check page) would otherwise answer /shop.
[[redirects]]
  from = "/shop.html"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
  to = "/shop/index.html"
  status = 200
  force = true

# Category pages: the same shell as /shop; shop.js picks what to show from the address.
[[redirects]]
  from = "/shop/ready-to-ship"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/made-to-order"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/belts"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/*"
  to = "/.netlify/functions/shop-page"
  status = 200

# The sitemap is built from the Stripe catalog, so it is a function, not a file.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/order/thanks"
  to = "/order-thanks.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

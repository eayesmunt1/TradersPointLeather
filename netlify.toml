[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# Security headers on every response. frame-ancestors (and X-Frame-Options for older browsers)
# stop other sites framing the shop; a full content policy is left out because GA, Crisp, Clarity
# and Stripe each load their own scripts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The repo root is the published folder, so repo-only files would otherwise be served.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/e2e/*"
  to = "/404"
  status = 404
  force = true

# On-site shop. /shop/<slug> is rendered by shop-page.js from the Stripe catalog (404 if unknown).
# Old links to /shop.html (a retired page) land on the shop.
[[redirects]]
  from = "/shop.html"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
  to = "/shop/index.html"
  status = 200
  force = true

# Category pages: the same shell as /shop; shop.js picks what to show from the address.
[[redirects]]
  from = "/shop/ready-to-ship"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/made-to-order"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/belts"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/*"
  to = "/.netlify/functions/shop-page"
  status = 200

# The sitemap is built from the Stripe catalog, so it is a function, not a file.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/order/thanks"
  to = "/order-thanks.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# On-site shop. /shop/<slug> is rendered by shop-page.js from the Stripe catalog (404 if unknown).
# The old shop.html (an Etsy API check page) would otherwise answer /shop.
[[redirects]]
  from = "/shop"
  to = "/shop/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/*"
  to = "/.netlify/functions/shop-page"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/order/thanks"
  to = "/order-thanks.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

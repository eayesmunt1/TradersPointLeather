<!-- Crisp live chat, copied from index.html. Loaded on page load; its launcher stays hidden and
     opens only when a buyer asks for a Made to Order build. -->
<script>
  window.CRISP_WEBSITE_ID = '555f5fde-3295-4ab0-9e41-d1ddb720f2e4';
  window.$crisp = [['do', 'chat:hide']];
  if (window.CRISP_WEBSITE_ID) {
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.src = 'https://client.crisp.chat/l.js';
      s.async = 1;
      document.head.appendChild(s);
    });
  }
</script>
<script src="/shop-config.js"></script>
<script src="/shop/shop.js" defer></script>
</head>
